<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>飞鹰班积分工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif}
body{display:flex;background:#f0f2f5}
/* 左侧导航 */
.sidebar{width:108px;min-width:108px;height:100vh;background:#fff;border-right:1px solid #e8e8e8;display:flex;flex-direction:column;position:fixed;left:0;top:0;z-index:10;overflow:hidden}
.sidebar-header{padding:10px 6px 8px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-align:center;flex-shrink:0}
.sidebar-header .logo{font-size:15px;font-weight:700;letter-spacing:1px}
.sidebar-header .sub{font-size:9px;opacity:.8;margin-top:2px}
.nav-tree{flex:1;overflow-y:auto;padding:4px 0}
.nav-tree::-webkit-scrollbar{width:3px}
.nav-tree::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
.nav-item{cursor:pointer;user-select:none}
.nav-label{display:flex;align-items:center;padding:8px 8px;font-size:13px;color:#333;border-left:3px solid transparent;transition:all .15s;gap:4px;line-height:1.3}
.nav-label:active{background:#f0f0f0}
.nav-label.active{background:#e6f7ff;border-left-color:#667eea;color:#667eea;font-weight:600}
.nav-label .icon{font-size:14px;flex-shrink:0;width:18px;text-align:center}
.nav-label .arrow{margin-left:auto;font-size:10px;color:#999;transition:transform .2s;flex-shrink:0}
.nav-label .arrow.open{transform:rotate(90deg)}
.nav-children{display:none;background:#fafafa}
.nav-children.open{display:block}
.nav-children .nav-label{padding-left:28px;font-size:12px;color:#666}
.nav-children .nav-label.active{color:#667eea;font-weight:600;background:#e6f7ff;border-left-color:#667eea}
/* 内容区 */
.content{margin-left:108px;flex:1;height:100vh;overflow-y:auto;padding:10px}
.page{display:none}
.page.active{display:block}
.page-title{font-size:16px;font-weight:700;color:#333;margin-bottom:10px;display:flex;align-items:center;gap:6px}
/* 卡片 */
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-title{font-size:13px;font-weight:600;color:#667eea;margin-bottom:8px}
/* 数据卡片 */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat-card{background:#fff;border-radius:10px;padding:10px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-card .num{font-size:22px;font-weight:800;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-card .lbl{font-size:10px;color:#999;margin-top:2px}
/* 冠军banner */
.banner{background:linear-gradient(135deg,#f6d365,#fda085);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.banner .medal{font-size:24px}
.banner .info .t{font-size:10px;color:rgba(0,0,0,.5)}
.banner .info .v{font-size:15px;font-weight:700;color:#333}
/* 排名行 */
.rank-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
.rank-row:last-child{border-bottom:none}
.rank-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;margin-right:8px}
.rank-num.r1{background:#ffd700}.rank-num.r2{background:#c0c0c0}.rank-num.r3{background:#cd7f32}
.rank-num.r4{background:#ddd;color:#666}
.rank-name{flex:1;font-weight:500}
.rank-group{font-size:11px;color:#999;margin-right:8px}
.rank-score{font-weight:700;font-size:14px;color:#667eea}
/* 筛选按钮 */
.filter-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border-radius:16px;border:1px solid #ddd;background:#fff;font-size:12px;color:#666;cursor:pointer;transition:all .15s}
.filter-btn.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent}
/* 每日明细 */
.day-block{margin-bottom:8px}
.day-header{font-size:12px;font-weight:600;color:#667eea;padding:4px 0;border-bottom:1px dashed #e0e0e0;margin-bottom:4px}
.day-items{display:flex;flex-wrap:wrap;gap:4px}
.day-tag{font-size:11px;background:#f0f0ff;padding:2px 6px;border-radius:4px;color:#555}
.day-tag .pts{color:#667eea;font-weight:700;margin-left:2px}
/* 荣誉卡片 */
.star-cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.star-card{min-width:90px;background:#fff;border-radius:10px;padding:10px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08);flex-shrink:0}
.star-card .wk{font-size:10px;color:#999}
.star-card .nm{font-size:14px;font-weight:700;color:#333;margin:4px 0}
.star-card .gr{font-size:10px;color:#667eea}
.star-card .emoji{font-size:22px}
/* 对比分析 */
select{width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:#fff;margin-bottom:8px}
.cmp-table{width:100%;border-collapse:collapse;font-size:12px}
.cmp-table th,.cmp-table td{padding:5px 4px;text-align:center;border-bottom:1px solid #f0f0f0}
.cmp-table th{background:#f8f8ff;color:#667eea;font-weight:600}
.cmp-table td.win{color:#52c41a;font-weight:700}
/* 趋势图表 */
.trend-section{margin-bottom:12px}
.trend-section-title{font-size:14px;font-weight:700;color:#333;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.trend-subtitle{font-size:12px;color:#999;font-weight:400;margin-left:4px}
.chart-tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chart-tab{padding:4px 12px;border-radius:14px;border:1px solid #ddd;background:#fff;font-size:12px;color:#666;cursor:pointer;transition:all .15s}
.chart-tab.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent}
.group-chart-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.group-chart-card{flex:1;min-width:280px;background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.group-chart-title{font-size:12px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:4px}
/* 表格通用 */
.simple-table{width:100%;border-collapse:collapse;font-size:12px}
.simple-table th,.simple-table td{padding:5px 4px;text-align:center;border-bottom:1px solid #f0f0f0}
.simple-table th{background:#f8f8ff;color:#667eea;font-weight:600;font-size:11px}
.simple-table td{color:#333}
.highlight-cell{color:#667eea;font-weight:700}
/* 积分构成表 */
.detail-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.detail-table{width:100%;border-collapse:collapse;font-size:11px;min-width:460px}
.detail-table th,.detail-table td{padding:4px 2px;text-align:center;border-bottom:1px solid #f0f0f0;white-space:nowrap}
.detail-table th{background:#f8f8ff;color:#667eea;font-weight:600;font-size:10px;position:sticky;top:0}
.detail-table td{color:#333}
.detail-table .name-col{text-align:left;font-weight:600;min-width:48px;position:sticky;left:0;background:#fff;z-index:1}
.detail-table th.name-col{background:#f8f8ff;z-index:2}
.detail-table .total-col{font-weight:700;color:#667eea;background:#fafaff}
.detail-table .subtotal-col{font-weight:600;color:#1890ff;background:#f5faff}
.detail-table .sum-row td{background:#fafaff;font-weight:700;border-top:2px solid #667eea}
/* ABCD色彩 */
.cat-a{color:#722ed1}.cat-b{color:#1890ff}.cat-c{color:#52c41a}.cat-d{color:#fa8c16}
.badge-a{display:inline-block;background:#f9f0ff;color:#722ed1;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:600}
.badge-b{display:inline-block;background:#e6f7ff;color:#1890ff;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:600}
.badge-c{display:inline-block;background:#f6ffed;color:#52c41a;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:600}
.badge-d{display:inline-block;background:#fff7e6;color:#fa8c16;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:600}
/* 可编辑单元格 */
.editable{cursor:pointer;border-bottom:1px dashed #ccc;transition:background .15s}
.editable:hover{background:#f0f0ff;border-radius:3px}
.edit-input{width:40px;border:1px solid #667eea;border-radius:4px;padding:1px 3px;font-size:11px;text-align:center;outline:none}
.edit-input:focus{box-shadow:0 0 0 2px rgba(102,126,234,.2)}
/* 规则说明 */
.rule-section{margin-bottom:8px}
.rule-title{font-size:12px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:4px}
.rule-items{font-size:11px;color:#555;line-height:1.6;padding-left:4px}
.rule-items span{display:inline-block;background:#f5f5f5;padding:0 4px;border-radius:3px;margin:1px 2px;font-size:10px;color:#666}
/* 知识库/通知/记录 */
.kb-item{padding:10px 0;border-bottom:1px solid #f5f5f5}
.kb-item:last-child{border-bottom:none}
.kb-item h4{font-size:13px;margin-bottom:3px;color:#333}
.kb-item .kb-meta{font-size:11px;color:#999}
.kb-cat{display:inline-block;background:#f0f0ff;color:#667eea;font-size:10px;padding:1px 6px;border-radius:3px;margin-right:6px}
.notice-item{padding:10px 0;border-bottom:1px solid #f5f5f5}
.notice-item:last-child{border-bottom:none}
.notice-item h4{font-size:13px;margin-bottom:3px}
.notice-item .meta{font-size:11px;color:#999;margin-bottom:4px}
.notice-item .content{font-size:12px;line-height:1.6;color:#555}
.pin-badge{display:inline-block;background:#fa8c16;color:#fff;font-size:10px;padding:1px 5px;border-radius:3px;margin-right:5px}
/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;width:520px;max-width:92vw;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-header{padding:14px 18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:15px}
.modal-close{font-size:20px;cursor:pointer;color:#999;border:none;background:none}
.modal-body{padding:16px 18px}
.modal-footer{padding:10px 18px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:8px}
.form-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.form-group{flex:1;min-width:120px}
.form-group label{display:block;font-size:11px;color:#999;margin-bottom:3px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit}
.form-group textarea{min-height:70px;resize:vertical}
.btn{padding:6px 14px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-primary{background:#667eea;color:#fff}
.btn-ghost{background:#f5f5f5;color:#666}
.btn-sm{padding:3px 8px;font-size:11px}
.btn-danger{background:#ff4d4f;color:#fff}
.edit-num{width:42px;padding:2px 4px;font-size:11px;border:1px solid #667eea;border-radius:3px;text-align:center}
.edit-text{width:70px;padding:2px 4px;font-size:11px;border:1px solid #667eea;border-radius:3px}
.edit-num:focus,.edit-text:focus{outline:none;border-color:#764ba2;box-shadow:0 0 3px rgba(118,75,162,0.3)}
/* 等级段位 */
.lv-badge{display:inline-block;font-size:10px;color:#fff;padding:1px 6px;border-radius:10px;margin-left:4px;vertical-align:middle;font-weight:600;white-space:nowrap}
.lv-bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:4px}
.lv-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.profile-head{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.profile-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.profile-info{flex:1}
.profile-info .pn{font-size:16px;font-weight:700;color:#333}
.profile-info .pg{font-size:11px;color:#999;margin-top:2px}
.profile-lv{background:#fafaff;border-radius:8px;padding:8px 10px;margin-bottom:8px}
/* 全局搜索 */
.search-box{position:relative}
.search-box input{padding-left:30px}
.search-box .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:#bbb}
/* 导出页 */
.export-icon{font-size:40px;text-align:center;margin:6px 0}
/* toast */
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:9999;transition:opacity .3s}
</style>
</head>
<body>
<!-- 左侧导航 -->
<div class="sidebar">
  <div class="sidebar-header">
    <div class="logo">🦅 飞鹰班</div>
    <div class="sub">积分工作台</div>
  </div>
  <div class="nav-tree" id="navTree"></div>
  <div id="sidebarFooter" style="padding:8px 6px;border-top:1px solid #eee;flex-shrink:0;text-align:center;"></div>
</div>
<!-- 内容区 -->
<div class="content" id="contentArea"></div>

<!-- ===== Modal: 知识库 ===== -->
<div class="modal-overlay" id="modal-kb">
  <div class="modal">
    <div class="modal-header"><h3 id="kb-modal-title">新建知识</h3><button class="modal-close" onclick="closeModal('modal-kb')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="kb-id" />
      <div class="form-row">
        <div class="form-group"><label>标题</label><input type="text" id="kb-title" placeholder="知识标题" /></div>
        <div class="form-group"><label>分类</label>
          <select id="kb-category">
            <option value="涂料知识">涂料知识</option>
            <option value="质量管理">质量管理</option>
            <option value="检测标准">检测标准</option>
            <option value="工艺实操">工艺实操</option>
            <option value="通用">通用</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>内容</label><textarea id="kb-content" style="min-height:180px;" placeholder="详细内容..."></textarea></div>
      <div class="form-group"><label>作者</label><input type="text" id="kb-author" placeholder="您的姓名" /></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-kb')">取消</button>
      <button class="btn btn-primary" onclick="submitKb()">保存</button>
    </div>
  </div>
</div>

<!-- ===== Modal: 通知 ===== -->
<div class="modal-overlay" id="modal-notice">
  <div class="modal">
    <div class="modal-header"><h3 id="notice-modal-title">发布通知</h3><button class="modal-close" onclick="closeModal('modal-notice')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="notice-id" />
      <div class="form-row">
        <div class="form-group"><label>标题</label><input type="text" id="notice-title" placeholder="通知标题" /></div>
        <div class="form-group"><label>类型</label>
          <select id="notice-type"><option value="通知">通知</option><option value="安排">安排</option><option value="公示">公示</option><option value="提醒">提醒</option></select>
        </div>
      </div>
      <div class="form-group"><label>内容</label><textarea id="notice-content" style="min-height:140px;" placeholder="通知内容..."></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>发布人</label><input type="text" id="notice-publisher" value="班长" /></div>
        <div class="form-group"><label>置顶</label><select id="notice-pinned"><option value="0">不置顶</option><option value="1">置顶</option></select></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-notice')">取消</button>
      <button class="btn btn-primary" onclick="submitNotice()">发布</button>
    </div>
  </div>
</div>

<!-- ===== Modal: 记录 ===== -->
<div class="modal-overlay" id="modal-record">
  <div class="modal">
    <div class="modal-header"><h3 id="record-modal-title">新增记录</h3><button class="modal-close" onclick="closeModal('modal-record')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="record-id" />
      <div class="form-row">
        <div class="form-group"><label>日期</label><input type="date" id="record-date" /></div>
        <div class="form-group"><label>分类</label>
          <select id="record-category"><option value="活动">活动</option><option value="会议">会议</option><option value="决策">决策</option><option value="奖惩">奖惩</option><option value="其他">其他</option></select>
        </div>
      </div>
      <div class="form-group"><label>标题</label><input type="text" id="record-title" placeholder="记录标题" /></div>
      <div class="form-group"><label>内容</label><textarea id="record-content" style="min-height:120px;" placeholder="详细内容..."></textarea></div>
      <div class="form-group"><label>记录人</label><input type="text" id="record-author" placeholder="您的姓名" /></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-record')">取消</button>
      <button class="btn btn-primary" onclick="submitRecord()">保存</button>
    </div>
  </div>
</div>

<!-- ===== Modal: 添加成员 ===== -->
<div class="modal-overlay" id="modal-member">
  <div class="modal">
    <div class="modal-header"><h3>添加成员</h3><button class="modal-close" onclick="closeModal('modal-member')">&times;</button></div>
    <div class="modal-body">
      <div class="form-group"><label>姓名</label><input type="text" id="member-name" placeholder="输入新成员姓名" /></div>
      <div class="form-group"><label>所属组别</label>
        <select id="member-group">
          <option value="第一组">第一组</option>
          <option value="第二组">第二组</option>
          <option value="第三组">第三组</option>
        </select>
      </div>
      <p style="font-size:11px;color:#999;margin:4px 0 0;line-height:1.6">添加后，该成员将自动进入每周积分、积分构成、每月积分、总积分排行（四个表同步）。</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-member')">取消</button>
      <button class="btn btn-primary" onclick="submitMember()">添加</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== 管理员权限 =====
const ADMIN_USER='李龙海';
const ADMIN_PASS='llh123456';
let isAdmin=false;
try{isAdmin=sessionStorage.getItem('fy_admin')==='1';}catch(e){}
function adminLogin(){
  var u=prompt('请输入管理员账号：');
  if(u===null)return;
  var p=prompt('请输入密码：');
  if(p===null)return;
  if(u===ADMIN_USER&&p===ADMIN_PASS){
    isAdmin=true;try{sessionStorage.setItem('fy_admin','1');}catch(e){}
    showToast('管理员登录成功');
    renderSidebarFooter();renderPage();
  }else{
    showToast('账号或密码错误');
  }
}
function adminLogout(){
  isAdmin=false;try{sessionStorage.removeItem('fy_admin');}catch(e){}
  showToast('已退出管理员模式');
  renderSidebarFooter();renderPage();
}
function requireAdmin(){
  if(!isAdmin){showToast('请先登录管理员账号');return false;}
  return true;
}

// ===== 通用编辑系统 =====
let editSections={}; // 记录哪些区域正在编辑
function editBtn(id,addAction){
  if(!isAdmin)return '';
  if(editSections[id]){
    var add=addAction?addAction:'';
    return add+'<button class="btn btn-primary btn-sm" style="float:right;margin-left:4px" onclick="saveEdit(\''+id+'\')">保存</button>'+
           '<button class="btn btn-ghost btn-sm" style="float:right" onclick="cancelEdit(\''+id+'\')">取消</button>';
  }
  return '<button class="btn btn-ghost btn-sm" style="float:right" onclick="startEdit(\''+id+'\')">编辑</button>';
}
function startEdit(id){editSections[id]=true;renderPage();}
function cancelEdit(id){delete editSections[id];renderPage();}
function saveEdit(id){
  // 各页面的save逻辑在对应函数中实现
  if(id==='td-detail')saveTD();
  else if(id==='pw-list')savePW();
  else if(id==='pd-table')savePD();
  else if(id==='dd-list')saveDD();
  else if(id==='stars-list')saveStars();

function _uniq(obj,base){var n=base,i=1;obj=obj||{};while(obj[n]!==undefined)n=base+(i++);return n;}
// ===== 成员级增删（影响 每周积分 / 积分构成 / 每月积分 / 总积分，全局同步）=====
function addMemberPrompt(){
  if(!requireAdmin())return;
  var nm=document.getElementById('member-name');
  var gp=document.getElementById('member-group');
  if(nm)nm.value='';
  if(gp)gp.value='第一组';

function submitMember(){
  var nm=document.getElementById('member-name');
  var gp=document.getElementById('member-group');
  if(!nm)return;
  var name=nm.value.trim();
  if(!name){showToast('请输入姓名');return;}
  var group=gp?gp.value:'第一组';
  closeModal('modal-member');
  addMember(name,group);
}
function addMember(name,group){
  if(!GROUPS[group])group='第一组';
  if(getGroup(name)){showToast('该成员已存在（'+getGroup(name)+'）');renderPage();return;}
  GROUPS[group].push(name);
  ['W1','W2','W3','W4','W5','W6','W7'].forEach(function(w){
    if(!PW[w])PW[w]={};PW[w][name]=0;
    if(!PD[w])PD[w]={};if(!PD[w][name])PD[w][name]={a:0,sp:0,an:0,ho:0,re:0,di:0,st:0,t:0};
  });
  saveData();renderPage();showToast('已添加成员 '+name);
}
function delMember(name){
  name=decodeURIComponent(name);
  if(!confirm('确认删除成员 '+name+'（将一并清除其所有积分记录）？'))return;
  for(var g in GROUPS){var i=GROUPS[g].indexOf(name);if(i>=0)GROUPS[g].splice(i,1);}
  ['W1','W2','W3','W4','W5','W6','W7'].forEach(function(w){if(PW[w])delete PW[w][name];if(PD[w])delete PD[w][name];});
  for(var m in monthlyData)delete monthlyData[m][name];
  if(totalData)delete totalData[name];
  saveData();renderPage();showToast('已删除成员 '+name);
}

// ===== 成员改名/调组 统一同步（避免各表数据不一致）=====
function syncRename(oldName,newName){
  if(!oldName||oldName===newName)return;
  for(var g in GROUPS){var i=GROUPS[g].indexOf(oldName);if(i>=0){if(GROUPS[g].indexOf(newName)<0)GROUPS[g][i]=newName;else GROUPS[g].splice(i,1);}}
  ['W1','W2','W3','W4','W5','W6','W7'].forEach(function(w){
    if(PW[w]&&PW[w][oldName]!==undefined){PW[w][newName]=PW[w][oldName];delete PW[w][oldName];}
    if(PD[w]&&PD[w][oldName]){PD[w][newName]=PD[w][oldName];delete PD[w][oldName];}
  });
  for(var m in monthlyData){if(monthlyData[m]&&monthlyData[m][oldName]!==undefined){monthlyData[m][newName]=monthlyData[m][oldName];delete monthlyData[m][oldName];}}
  if(totalData&&totalData[oldName]!==undefined){totalData[newName]=totalData[oldName];delete totalData[oldName];}
  stars.forEach(function(s){if(s.name===oldName)s.name=newName;});
  monthlyStars.forEach(function(s){if(s.name===oldName)s.name=newName;});
  DB.forEach(function(d){if(d.name===oldName)d.name=newName;});
}
function setMemberGroup(name,newGroup){
  if(!GROUPS[newGroup])return;
  for(var g in GROUPS){var i=GROUPS[g].indexOf(name);if(i>=0)GROUPS[g].splice(i,1);}
  if(GROUPS[newGroup].indexOf(name)<0)GROUPS[newGroup].push(name);
}

  h+='</select>';
  return h;
}

// 清洗每日明细中被错误编码的日期 key（早期 addDDItem 漏 decode 导致 8%E6%9C%88... 这类乱码 key）
function cleanDDKeys(){
  var changed=false;
  for(var wk in DD){
    for(var day in DD[wk]){
      if(day.indexOf('%')>=0){
        try{
          var real=decodeURIComponent(day);
          if(real!==day){
            if(!DD[wk][real]){DD[wk][real]=DD[wk][day];}
            else{
              for(var g in DD[wk][day]){
                if(!DD[wk][real][g]){DD[wk][real][g]=DD[wk][day][g];}
                else{
                  for(var nm in DD[wk][day][g]){
                    if(DD[wk][real][g][nm]===undefined||DD[wk][real][g][nm]===0)DD[wk][real][g][nm]=DD[wk][day][g][nm];
                  }
                }
              }
            }
            delete DD[wk][day];
            changed=true;
          }
        }catch(e){}
      }
    }
  }
  if(changed)saveData();
}
function loadData(){
  try{
    var d;
    d=localStorage.getItem('fy_td');if(d)TD=JSON.parse(d);
    d=localStorage.getItem('fy_pw');if(d)PW=JSON.parse(d);
    d=localStorage.getItem('fy_dd');if(d)DD=JSON.parse(d);

    d=localStorage.getItem('fy_db');if(d){DB.length=0;DB.push.apply(DB,JSON.parse(d));}
    d=localStorage.getItem('fy_stars');if(d)stars=JSON.parse(d);
    d=localStorage.getItem('fy_monthly_stars');if(d)monthlyStars=JSON.parse(d);
    d=localStorage.getItem('fy_monthly_data');if(d)monthlyData=JSON.parse(d);
    d=localStorage.getItem('fy_total_data');if(d)totalData=JSON.parse(d);
    d=localStorage.getItem('fy_overview_data');if(d)overviewData=JSON.parse(d);
  }catch(e){}
  cleanDDKeys();
}

// ===== 等级段位系统（游戏化，参考 Keep/Duolingo）=====
const LEVELS=[
  {name:'青铜',icon:'🥉',min:0,color:'#cd7f32'},
  {name:'白银',icon:'🥈',min:30,color:'#9ca3af'},
  {name:'黄金',icon:'🥇',min:55,color:'#f5b301'},
  {name:'铂金',icon:'💎',min:75,color:'#06b6d4'},
  {name:'王者',icon:'👑',min:95,color:'#a855f7'}
];
function getLevel(score){
  let lv=LEVELS[0];
  for(let i=0;i<LEVELS.length;i++){if(score>=LEVELS[i].min)lv=LEVELS[i];}
  let next=LEVELS.find(l=>l.min>score);
  let prog=100,need=0;
  if(next){need=next.min-score;prog=Math.round((score-lv.min)/(next.min-lv.min)*100);}
  prog=Math.max(0,Math.min(100,prog));
  return {icon:lv.icon,name:lv.name,color:lv.color,min:lv.min,nextName:next?next.name:'',nextIcon:next?next.icon:lv.icon,need:need,prog:prog};
}
function levelBadge(score){var l=getLevel(score);return '<span class="lv-badge" style="background:'+l.color+'">'+l.icon+l.name+'</span>';}

function renderNav(){
  const tree=document.getElementById('navTree');
  let html='';
  NAV.forEach(item=>{
    const hasChildren=item.children&&item.children.length>0;
    const isLeaf=!hasChildren;
    const isActive=isLeaf&&item.id===currentPage;
    let childOpen=false;
    if(hasChildren)childOpen=item.children.some(c=>c.id===currentPage);
    html+=`<div class="nav-item">`;
    html+=`<div class="nav-label${isActive?' active':''}" data-id="${item.id}" data-has-children="${hasChildren}" onclick="navClick(this)">`;
    html+=`<span class="icon">${item.icon}</span>`;
    html+=`<span>${item.label}</span>`;
    if(hasChildren)html+=`<span class="arrow${childOpen?' open':''}">▶</span>`;
    html+=`</div>`;
    if(hasChildren){
      html+=`<div class="nav-children${childOpen?' open':''}">`;
      item.children.forEach(c=>{
        const cActive=c.id===currentPage;
        html+=`<div class="nav-label${cActive?' active':''}" data-id="${c.id}" onclick="navClick(this)"><span>${c.label}</span></div>`;
      });
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  tree.innerHTML=html;
}

function navClick(el){
  const id=el.dataset.id;
  const hasChildren=el.dataset.hasChildren==='true';
  if(hasChildren){
    const children=el.nextElementSibling;
    const arrow=el.querySelector('.arrow');
    if(children){children.classList.toggle('open');if(arrow)arrow.classList.toggle('open');}
  } else {
    currentPage=id;
    renderNav();
    renderPage();
  }
}

function fyZip(files){

    dv.setUint16(10,0,true);

    dv.setUint32(18,size,true);
    dv.setUint32(22,size,true);

    cd.setUint16(8,0,true);
    cd.setUint16(10,0,true);
    cd.setUint16(12,0,true);
    cd.setUint16(14,0,true);
    cd.setUint32(16,crc,true);
    cd.setUint32(20,size,true);
    cd.setUint32(24,size,true);
    cd.setUint16(28,nb.length,true);
    cd.setUint16(30,0,true);
    cd.setUint16(32,0,true);
    cd.setUint16(34,0,true);
    cd.setUint16(36,0,true);

  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();

function drawGroupLineChart(){

function drawIndDailyChart(){
  var canvas=document.getElementById('indDailyChart');if(!canvas)return;
  var gColors={'第一组':'#667eea','第二组':'#fda085','第三组':'#52c41a'};
  var dpr=window.devicePixelRatio||1;var rect=canvas.parentElement.getBoundingClientRect();
  var W=rect.width-20;var H=220;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var days=[];['W1','W2','W3','W4','W5','W6','W7'].forEach(function(w){if(DD[w])for(var d in DD[w])days.push({date:d,week:w});});
  days.sort(function(a,b){return a.date.localeCompare(b.date);});
  if(!days.length){ctx.fillStyle='#999';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('暂无每日数据',W/2,H/2);return;}
  var ml=36,mr=10,mt=20,mb=50;var cW=W-ml-mr,cH=H-mt-mb;
  var dailyScores=days.map(function(dd){var s=0;var dayData=DD[dd.week]&&DD[dd.week][dd.date];if(dayData)for(var g in dayData)if(dayData[g][trendPerson])s+=dayData[g][trendPerson];return s;});
  var maxV=Math.max.apply(null,dailyScores.concat([1]))*1.3;
  var barW=Math.max(4,cW/days.length*0.7);var gap=cW/days.length;
  ctx.strokeStyle='#f0f0f0';ctx.lineWidth=0.5;
  for(var i=0;i<=4;i++){var y=mt+cH*(1-i/4);ctx.beginPath();ctx.moveTo(ml,y);ctx.lineTo(ml+cW,y);ctx.stroke();ctx.fillStyle='#bbb';ctx.font='9px sans-serif';ctx.textAlign='right';ctx.fillText(Math.round(maxV*i/4),ml-4,y+3);}
  var color=gColors[getGroup(trendPerson)]||'#667eea';
  dailyScores.forEach(function(v,i){if(v<=0)return;var x=ml+gap*i+(gap-barW)/2;var h=v/maxV*cH;ctx.fillStyle=color+'99';ctx.fillRect(x,mt+cH-h,barW,h);ctx.fillStyle=color;ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText(v,x+barW/2,mt+cH-h-4);});
  ctx.fillStyle='#999';ctx.font='8px sans-serif';ctx.textAlign='center';
  days.forEach(function(d,i){if(i%2===0||days.length<=12){var x=ml+gap*i+gap/2;ctx.save();ctx.translate(x,H-8);ctx.fillText(d.date.slice(-2)+'日',0,0);ctx.restore();}});
  ctx.fillStyle=color;ctx.font='bold 12px sans-serif';ctx.textAlign='left';ctx.fillText(trendPerson+' 每日得分',ml,14);
}

function drawSuggestionCharts(){drawCumulativeChart();drawTop5Chart();var sel=document.getElementById('sugPersonSel');if(sel)sel.onchange=drawCumulativeChart;}
function drawCumulativeChart(){
  var canvas=document.getElementById('cumulativeChart');if(!canvas)return;
  var sel=document.getElementById('sugPersonSel');var person=sel?sel.value:'李龙海';
  var wks=['W1','W2','W3','W4','W5','W6','W7'];var gColors={'第一组':'#667eea','第二组':'#fda085','第三组':'#52c41a'};
  var dpr=window.devicePixelRatio||1;var rect=canvas.parentElement.getBoundingClientRect();
  var W=rect.width-20;var H=220;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var ml=44,mr=16,mt=16,mb=36;var cW=W-ml-mr,cH=H-mt-mb;
  var data=wks.map(function(w,i){var s=0;for(var j=0;j<=i;j++)s+=(PW[wks[j]]&&PW[wks[j]][person])||0;return s;});
  var maxV=Math.max.apply(null,data.concat([1]))*1.15;
  ctx.strokeStyle='#f0f0f0';ctx.lineWidth=0.5;
  for(var i=0;i<=4;i++){var y=mt+cH*(1-i/4);ctx.beginPath();ctx.moveTo(ml,y);ctx.lineTo(ml+cW,y);ctx.stroke();ctx.fillStyle='#bbb';ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillText(Math.round(maxV*i/4),ml-6,y+4);}
  ctx.fillStyle='#999';ctx.textAlign='center';ctx.font='11px sans-serif';
  wks.forEach(function(w,i){ctx.fillText(w,ml+cW*(i+0.5)/wks.length,H-10);});
  var color=gColors[getGroup(person)]||'#667eea';
  var pts=data.map(function(v,i){return{x:ml+cW*(i+0.5)/wks.length,y:mt+cH*(1-v/maxV)};});
  ctx.beginPath();ctx.moveTo(pts[0].x,mt+cH);pts.forEach(function(p){ctx.lineTo(p.x,p.y);});ctx.lineTo(pts[pts.length-1].x,mt+cH);ctx.closePath();ctx.fillStyle=color+'15';ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
  pts.forEach(function(p,i){ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.stroke();ctx.fillStyle=color;ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(data[i],p.x,p.y-12);});
  ctx.fillStyle=color;ctx.font='bold 12px sans-serif';ctx.textAlign='left';ctx.fillText(person+' 累计积分增长',ml,12);
}
function drawTop5Chart(){
  var canvas=document.getElementById('top5Chart');if(!canvas)return;
  var wks=['W1','W2','W3','W4','W5','W6','W7'];var dpr=window.devicePixelRatio||1;var rect=canvas.parentElement.getBoundingClientRect();
  var W=rect.width-20;var H=220;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var ml=44,mr=16,mt=16,mb=36;var cW=W-ml-mr,cH=H-mt-mb;
  var names=getAllNames();var rank=names.map(function(n){var s=0;wks.forEach(function(w){s+=(PW[w]&&PW[w][n])||0;});return{name:n,total:s};});
  rank.sort(function(a,b){return b.total-a.total;});
  var top5=rank.slice(0,5).map(function(r){return r.name;});
  var allMax=0;var top5Data=top5.map(function(n){return wks.map(function(w,i){var s=0;for(var j=0;j<=i;j++)s+=(PW[wks[j]]&&PW[wks[j]][n])||0;return s;});});
  top5Data.forEach(function(arr){arr.forEach(function(v){if(v>allMax)allMax=v;});});allMax=Math.max(allMax,1)*1.15;
  ctx.strokeStyle='#f0f0f0';ctx.lineWidth=0.5;
  for(var i=0;i<=4;i++){var y=mt+cH*(1-i/4);ctx.beginPath();ctx.moveTo(ml,y);ctx.lineTo(ml+cW,y);ctx.stroke();ctx.fillStyle='#bbb';ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillText(Math.round(allMax*i/4),ml-6,y+4);}
  ctx.fillStyle='#999';ctx.textAlign='center';ctx.font='11px sans-serif';
  wks.forEach(function(w,i){ctx.fillText(w,ml+cW*(i+0.5)/wks.length,H-10);});
  var lineColors=['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db'];
  top5.forEach(function(n,ni){
    var data=top5Data[ni];var pts=data.map(function(v,i){return{x:ml+cW*(i+0.5)/wks.length,y:mt+cH*(1-v/allMax)};});
    ctx.strokeStyle=lineColors[ni];ctx.lineWidth=2;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
    pts.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=lineColors[ni];ctx.lineWidth=1.5;ctx.stroke();});
  });
  ctx.font='10px sans-serif';ctx.textAlign='left';
  top5.forEach(function(n,i){var col=i%3;var row=Math.floor(i/3);var lx=ml+col*(cW/3)+4;var ly=H-8+row*12;ctx.fillStyle=lineColors[i];ctx.fillRect(lx,ly-7,10,3);ctx.fillStyle='#666';ctx.fillText(n,lx+13,ly-4);});
}
